<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오스티아 — Mariner Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#06191f;--panel:#0b2a34;--panel2:#104050;--line:#1d5766;--brass:#d6ab52;--brass2:#8f6d28;--tx:#e7f0ec;--mut:#8aabaa;--warn:#e58a5b;
--port-y:#e3c066;--port-o:#cf7d4d;--sea1:#0f5560;--sea2:#0a3b47;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 20% -10%,#0f4651 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.5 'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#app{max-width:1480px;margin:0 auto;padding:12px 14px 40px}
button,input,select{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 2px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:700 26px 'Cinzel',Georgia,serif;letter-spacing:.14em;color:var(--brass)}
.brand span{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:13px}
.chip.gold{border-color:var(--brass);color:var(--brass)}.chip.warn{border-color:var(--warn);color:var(--warn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--brass));margin-right:6px;vertical-align:middle}
.tools{display:flex;gap:8px;align-items:center}
.spd{color:var(--mut);font-size:12px}.spd select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.stage{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.left,.right{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(max-width:900px){.stage{display:flex;flex-direction:column;gap:14px}.left,.right{display:contents}.stage .left>*,.stage .right>*{order:5}.stage .left>.map-card{order:1}.stage .right>.card.act{order:2}}
.card{background:linear-gradient(180deg,var(--panel),#09222b);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.card h2 small{font-weight:400;color:var(--mut);font-size:12px}
.card.act{border-color:var(--c,var(--brass));box-shadow:0 0 0 1px var(--c,var(--brass)) inset}
.hint{color:var(--mut);font-size:12.5px;margin:6px 0}.hint.c{text-align:center}
.mut{color:var(--mut)}
.lbl{margin:10px 0 4px;color:var(--brass);font-weight:700;font-size:12.5px}
/* map */
.map{width:100%;height:auto;display:block;border-radius:8px;background:radial-gradient(circle at 30% 30%,var(--sea1),var(--sea2) 75%)}
.map .edge{stroke:#d9f0ea;stroke-width:9;stroke-linecap:round;opacity:.78}
.map .coast{fill:none;stroke:var(--brass);stroke-width:4;stroke-dasharray:16 12;opacity:.8}
.map .disc-empty{fill:none;stroke:var(--brass);stroke-width:3;opacity:.35}
.map .sea-lbl{fill:var(--brass);font-size:34px;opacity:.85}
.map .nm{font-size:11px;font-weight:700;fill:#15252b}
.map .ic{font-size:10.5px;fill:#15252b}
.map .port.y{fill:var(--port-y);stroke:#fff3c4;stroke-width:1.5}.map .port.o{fill:var(--port-o);stroke:#ffd9bf;stroke-width:1.5}
.map .dest{fill:#bfe3f2;stroke:#fff;stroke-width:1.5}
.map .ostia{fill:#d8cfae;stroke:#fff;stroke-width:1.5}
.map .hex{fill:#f0e6c3;stroke:#fff;stroke-width:1.5}
.map .disc circle{fill:#0b2a34;stroke:var(--brass);stroke-width:1.5}.map .disc.tri circle{fill:#4a3a10}
.map .dsc{stroke:#fff;stroke-width:1.2}
.map [data-a]{cursor:pointer}.map [data-a]:hover .port,.map [data-a]:hover .dest,.map [data-a]:hover .hex{stroke:#fff;stroke-width:3}
.info{margin-top:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#08222b;font-size:13px}
.pl{display:inline-block;padding:0 7px;border-radius:99px;border:1px solid var(--c);font-size:12px}
/* orders */
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ord{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#0a2630}
.ord em{grid-column:1/-1;font-style:normal;color:var(--mut);font-size:12.5px}
.hons{display:grid;gap:6px}.hon{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#0a2630;font-size:13px}.hon.mine{border-color:var(--brass)}
/* ring */
.wc{filter:grayscale(1) brightness(2.2)}
.resbar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}.resbar b{font-size:16px}
/* panel */
.taskbox{margin-top:6px}
.guide{margin:6px 0 8px}.guide small{color:var(--mut)}
.opts{display:grid;gap:6px;margin:6px 0}.opts.row{display:flex;flex-wrap:wrap}
.b{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-align:left}
.b:hover:not(:disabled){border-color:var(--brass)}
.b:disabled{opacity:.38;cursor:not-allowed}
.b:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.b.pri{background:var(--brass);border-color:var(--brass);color:#1b1405;font-weight:700}
.b.lg{padding:11px 22px;font-size:16px}
.b.big{display:flex;flex-direction:column;gap:1px}.b.big small{color:var(--mut)}.b.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset}
.b small{opacity:.8}
.seq{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.slot{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:3px 6px;border:1px dashed var(--line);border-radius:6px;font-size:18px}.slot i{font-style:normal;font-size:10.5px;color:var(--mut)}.slot.on{border-style:solid;border-color:var(--brass)}
.trade{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.dlist{display:grid;gap:6px}.dcard{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#0a2630}.dcard.on{border-color:var(--brass);border-left-color:var(--nb)}.dcard label{display:block;cursor:pointer}.dcard .bn{color:var(--mut);font-size:12.5px;margin-top:2px}
.pbuy{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:space-between;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}.tracks div{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#0a2630}.tracks small{color:var(--mut)}
.icons{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0;font-size:15px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pc{padding:8px 10px;border:1px solid var(--line);border-radius:8px;border-left:4px solid var(--c);background:#0a2630;font-size:13px}.pc.cur{box-shadow:0 0 0 2px var(--c) inset}
.log{list-style:none;margin:8px 0 0;padding:0;max-height:240px;overflow:auto;font-size:12.5px;color:var(--mut)}.log li{padding:2px 0;border-bottom:1px solid #123a46}
details summary{cursor:pointer}
.result{border-color:var(--brass);margin-bottom:14px}.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:8px 10px;background:#0a2630}.rc.win{box-shadow:0 0 0 2px var(--brass) inset}
.rc h3{margin:0 0 6px;display:flex;justify-content:space-between;font-size:16px}.rc h3 span{color:var(--brass);font-size:22px}
.rc ul{list-style:none;margin:0;padding:0;font-size:12.5px}.rc li{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid #123a46}.rc em{font-style:normal;color:var(--mut)}
/* setup */
.setup{max-width:560px;margin:4vh auto 0}.hero{text-align:center;margin-bottom:14px}
.hero h1{margin:0;font:700 56px 'Cinzel',Georgia,serif;letter-spacing:.2em;color:var(--brass)}.hero p{margin:0;color:var(--mut)}
.srow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}.srow input{flex:1;background:#08222b;border:1px solid var(--line);border-radius:8px;padding:7px 10px;border-left:4px solid var(--c)}
.opt{display:block;padding:7px 0;cursor:pointer}.opt.off{opacity:.45;cursor:default}
@media(prefers-reduced-motion:no-preference){.seg,.b{transition:background .15s,border-color .15s}}

.map .dl{stroke:var(--brass);stroke-width:4;stroke-dasharray:6 9;opacity:.9}.map .dj{fill:var(--brass)}
.ring{position:relative;width:100%;max-width:520px;margin:12px auto;padding-bottom:96.2%}
.hx{position:absolute;width:33.34%;height:40%;background:var(--line);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hxi{position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#0a2630;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:12% 12%}
.h5{left:16.67%;top:0}.h0{left:50%;top:0}.h1{left:66.67%;top:30%}.h2{left:50%;top:60%}.h3{left:16.67%;top:60%}.h4{left:0;top:30%}
.hxi.r0{background:#0e2e3f}.hxi.r1{background:#2a2414}.hxi.r2{background:#2a2a14}.hxi.r3{background:#1f2a2e}.hxi.r4{background:#2c2610}.hxi.r5{background:#241c33}
.hn{font-weight:700;font-size:13px;white-space:nowrap}
.hr{display:flex;align-items:center;gap:4px;font-size:14px}.hr b{font-size:17px}.hr .pv{color:#7fe0a4;font-weight:700;font-size:12px}

.hx.pick{background:var(--brass);cursor:pointer}.hx.pick:hover .hxi,.hx.pick:focus-visible .hxi{background:#17485a}.hx.pick:focus-visible{background:#fff;outline:none}
.hc{position:absolute;left:33.33%;top:30%;width:33.34%;height:40%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--brass);font-size:11px;line-height:1.3;opacity:.7}

.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.sec{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#0a2630}.sec.now{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}.sec.dn{opacity:.55}

.chs{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0;font-size:17px}.ch{font-style:normal;position:relative;min-width:22px;text-align:center}.ch.tk{color:#3d6470}.ch b{position:absolute;right:-3px;bottom:-5px;font-size:10px;color:#7fe0a4}
.evt{font-size:12.5px;color:var(--mut)}.evt b{color:var(--tx)}
.city{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:#0a2630;min-height:74px;-webkit-touch-callout:none;user-select:none;cursor:help}.cs b{font-size:22px;line-height:1.1;white-space:nowrap}.cs.tk{opacity:.35;cursor:default}.cs small{font-size:15px;font-weight:700;color:#ffe38a;background:#00000055;border-radius:99px;padding:1px 9px;white-space:nowrap}
.tip{position:fixed;z-index:99;max-width:260px;background:#10151b;color:#fff;border:1px solid #ffe38a;border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.4;pointer-events:none;box-shadow:0 4px 14px #0008}
.seg{display:flex;gap:4px;margin-left:auto}.seg .b{padding:5px 8px;font-size:12.5px}
.free{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.barr .bad{color:var(--warn);font-weight:700}

.confirm{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.confirm .pri{flex:1;min-width:160px}

.hboard{width:100%;max-width:560px;display:block;margin:8px auto;border-radius:14px}
.hboard .wpoly{fill:transparent}.hboard .wedge.pick{cursor:pointer}.hboard .wedge.pick:hover .wpoly,.hboard .wedge.pick:focus-visible .wpoly{fill:rgba(255,255,255,.28)}.hboard .wedge.pick:focus-visible{outline:none}

.hcen{font-size:13px;fill:#d7f0ea;opacity:.75}.hlab2{font-size:11px;fill:#3a6f6a}.hlab2.b{font-size:15px;font-weight:700;fill:#1c2d2a}.hlab3{font-size:12px;fill:#fff;paint-order:stroke;stroke:#5a3c1c;stroke-width:3px;font-weight:700}
.hup{font-size:10.5px;fill:#4a3318}.hup.on{fill:#fff;font-weight:700}
.tboard{width:100%;max-width:340px;display:block;margin:8px auto}.tboard .tn{font-size:24px;font-weight:700;fill:#2a6b60}.tboard .hlab3{fill:#2a6b60;stroke:none;font-size:12px}
.map{background:linear-gradient(160deg,#2f8f80,#1d6458)}

.map{background:#1d2b2b}.map .edge{stroke:#fff;stroke-width:9;opacity:.95}.map .coast{stroke:#b9cf8a;stroke-width:5;stroke-dasharray:22 14;opacity:.9}

.map [data-a]:hover .ppanel,.map [data-a]:hover .hex,.map [data-a]:hover .dest{stroke:#ffe38a}

.ord{display:block}

/* ---------- 납품 ---------- */

/* ---------- 점수 ---------- */
function scoreP(G,P){
 const ic=finalIcons(G,P),tv=triVals(P.tri),L=[],dist=distCount(P),jv=P.supp==='juvenalis';
 const set=jv?Math.min(Math.floor((ic.wild+ic.exo)/2),Math.floor((ic.man+ic.woman)/2)):Math.min(ic.wild,ic.exo,ic.man,ic.woman);
 L.push(['개선 배율 · 건물 '+ic.bld+'×'+tv[0],ic.bld*tv[0]]);
 L.push(['개선 배율 · 배 '+ic.ship+'×'+tv[1],ic.ship*tv[1]]);
 L.push(['개선 배율 · 암포라 '+ic.amp+'×'+tv[2],ic.amp*tv[2]]);
 for(const n of DESTS){ const d=G.dest[n]; const r=d.spots.indexOf(P.id); if(r<0)continue; const f=r===0?0:1,t=d.tile;
  let v=0; if(t.flat)v=t.flat[f]; else if(t.per){ const c=t.per==='set'?set:t.per==='dist'?dist:ic[t.per]; v=c*t.v[f]; }
  if(v)L.push(['목적지 '+NODES[n].name+' ('+(f?'후순위':'1등')+')',v]); }
 for(const n of PORTS) if(P.hasDisc[n]){ const t=G.ports[n].tile; if(t.t==='end'&&t.vp){ const q=t.vp.per==='set'?set:t.vp.per==='dist'?dist:ic[t.vp.per]; L.push(['무역항 '+NODES[n].name+' 종료 효과',q*t.vp.n]); } }
 if(P.honors.length)L.push(['공개 명예 카드 ×'+P.honors.length,12*P.honors.length]);
 if(P.personal&&P.pFlip)L.push(['개인 명예 카드',15]);
 L.push(['4종 세트 ×'+set,12*set]);
 if(jv&&set)L.push(['유베날리스 세트 보너스 ×'+set,5*set]);
 for(const s of P.supEnd){
  if(s.k==='pair'){ const c=Math.min(ic[s.a],ic[s.b]); L.push(['후원자: '+s.txt,3*c]); }
  if(s.k==='dset'){ const c=Math.min(Math.floor(ic[s.a]/2),dist); L.push(['후원자: '+s.txt,6*c]); }
 }

 if(G.pir){
  const lv=P.leg?LEG_VP[P.leg-1]:0;
  if(P.treasure)L.push(['보물 상자 '+P.treasure+'개 × 군단병 '+lv+'VP',P.treasure*lv]);
  const sp=P.supp;
  if(sp==='quintilianus'&&P.qCubes)L.push(['퀸틸리아누스 큐브 ×'+P.qCubes,4*P.qCubes]);
  if(sp==='tacitus'&&P.honors.length)L.push(['타키투스 명예 카드 보너스 ×'+P.honors.length,8*P.honors.length]);
  if(sp==='lucius'&&P.lqCubes)L.push(['루키우스 큐브 ×'+P.lqCubes+' × 건물 '+ic.bld,P.lqCubes*ic.bld]);
  if(sp==='suetonius'&&P.treasure)L.push(['수에토니우스: 상자 '+P.treasure+' × 원해 코르비타 '+dist,P.treasure*dist]);
  if(sp==='apollodorus'){ const n=oc(P),v=n>=5?30:n>=3?15:n>=1?5:0; if(v)L.push(['아폴로도루스 (주황 무역항 '+n+'곳)',v]); }
  if(sp==='cornelius'&&P.cqCubes)L.push(['코르넬리우스 큐브 ×'+P.cqCubes,6*P.cqCubes]);
  if(sp==='trajanus'&&P.trajTile&&P.trajPos>=4){ const t=P.trajTile; let v=0; if(t.flat)v=t.flat[0]; else if(t.per){ const c=t.per==='set'?set:t.per==='dist'?dist:ic[t.per]; v=c*t.v[0]; } if(v)L.push(['트라야누스 목적지 타일 (큐브 도착)',v]); }
  if(sp==='hadrianus'&&P.hadAmp)L.push(['하드리아누스 암포라 ×'+P.hadAmp,4*P.hadAmp]);
  for(const ct of P.cityEnd){ const q=ct.vp==='chest'?P.treasure:ic[ct.vp]; L.push(['오스티아 시티 '+ct.ic,q]); }
  if(P.dis)L.push(['불명예 큐브 ×'+P.dis,-7*P.dis]);
 }

}
function finishGame(G){

 const rs=G.players.map(P=>({p:P.id,name:P.name,sc:scoreP(G,P),res:RES.reduce((a,r)=>a+P.store[r],0)}));
 const max=Math.max(...rs.map(r=>r.sc.total)); let w=rs.filter(r=>r.sc.total===max);
 if(w.length>1){ const m2=Math.max(...w.map(r=>r.res)); w=w.filter(r=>r.res===m2); }
 G.result={rows:rs,winners:w.map(r=>r.p)};
 logm(G,'게임 종료 — 승자: '+w.map(r=>r.name).join(', '));

/* ---------- 설정 단계 진행 ---------- */
function doInitPort(G,P,node){
 const pt=G.ports[node]; if(!YELLOW.includes(node)||pt.stack.length)return false;
 pt.stack.push(P.id); P.hasDisc[node]=true; P.upg.init=true; P.visited[node]=true;
 logm(G,P.name+': '+NODES[node].name+' 선택 (초기 무역항)'); return true;
}
function setupNext(G){
 const S=G.setup,np=G.np;
 for(;;){
  if(S.stage==='init'){
   if(!G.opts.patronus) for(const P of G.players)RES.slice(0,5).forEach(r=>P.store[r]+=2);
   S.stage=G.opts.patronus?'patDeal':'honor'; continue;
  }
  if(S.stage==='patDeal'){
   const deck=shuffle(G,supportDeck()); G.hands=[]; for(let i=0;i<np;i++)G.hands.push(deck.splice(0,5));
   S.round=0; S.started=false; S.stage='patRound'; logm(G,'후원자 드래프트 시작 — 5장 중 1장씩 고르고 왼쪽으로 넘깁니다.'); continue;
  }
  if(S.stage==='patRound'){
   if(S.started){ const h=G.hands.slice(); for(let i=0;i<np;i++)G.hands[(i+1)%np]=h[i]; }
   S.started=true;
   if(S.round>=5){ S.stage='patKeep'; continue; }
   S.round++; let pushed=false;
   for(let p=0;p<np;p++){ if(G.hands[p].length===1){ G.players[p].sup.push(G.hands[p].pop()); } else { G.queue.push({type:'patPick',p}); pushed=true; } }
   if(pushed)return; continue;
  }
  if(S.stage==='patKeep'){ for(let p=0;p<np;p++)G.queue.push({type:'patKeep',p}); S.stage='patImm'; return; }
  if(S.stage==='patImm'){
   S.stage='honor'; let pushed=false;
   for(let p=np-1;p>=0;p--){ const P=G.players[p];
    for(const t of P.sup){
     if(t.end){ P.supEnd.push(t); continue; }
     for(const e of t.eff){
      if(e.k==='whiteC'){G.queue.push({type:'whiteC',p});pushed=true;}
      else if(e.k==='light'){G.queue.push({type:'light',p});pushed=true;}
      else if(e.k==='sail1'){G.queue.push({type:'sail',p,free:true,steps:1,single:true,stage:'move'});pushed=true;}
      else if(e.k==='tri')addTri(G,P,1);
      else if(e.k==='res')P.store[e.res]+=e.n;
      else if(e.k==='gold')P.store.gold+=e.n;
      else if(e.k==='ampbox')P.amp++;
      else if(e.k==='wildexo'){P.wild++;P.exo++;}
     }
    }
   }
   if(pushed)return; continue;
  }
  if(S.stage==='honor'){
   S.stage=G.opts.pirates?'pir':'start';
   if(G.opts.personal){ G.pReveal=shuffle(G,PERS.map(x=>x.id)).slice(0,np+1);
    for(let p=np-1;p>=0;p--)G.queue.push({type:'honorPick',p}); return; }
   continue;
  }
  if(S.stage==='pir'){
   const hs=shuffle(G,HOME_DEF.map(x=>x.id)),ss=shuffle(G,SUPP_DEF.map(x=>x.id));
   G.pir.offers=G.players.map((P,i)=>({home:hs.splice(0,2),supp:ss.splice(0,2)}));
   S.stage='pirApply';
   for(let p=0;p<np;p++){ G.queue.push({type:'pirPick',p,kind:'home'}); G.queue.push({type:'pirPick',p,kind:'supp'}); }
   logm(G,'해적 확장 준비 — 고향 도시와 후원자를 각자 비공개로 고릅니다.'); return;
  }
  if(S.stage==='pirApply'){
   S.stage='start'; let pushed=false;
   for(const P of G.players){
    P.home=P.pick.home; P.supp=P.pick.supp;
    const h=HOME_DEF.find(x=>x.id===P.home),s=SUPP_DEF.find(x=>x.id===P.supp); P.dis=h.dis+s.dis;
    logm(G,P.name+': 고향 '+h.name+' · 후원자 '+s.name+' (불명예 '+P.dis+')');
    if(P.home==='byblus'){ G.queue.push({type:'whiteC',p:P.id},{type:'whiteC',p:P.id}); pushed=true; }
    if(P.supp==='trajanus'&&G.unusedDT.length){ P.trajTile=G.unusedDT.pop(); logm(G,P.name+': 트라야누스 — 미사용 목적지 타일 「'+P.trajTile.txt+'」을 가져옴'); }
   }
   if(pushed)return; continue;
  }
  if(S.stage==='start'){ G.phase='play'; G.cur=0; G.round=1; startTurn(G); logm(G,'본 게임 시작 — '+G.players[0].name+' 선공'); return; }
  return;
 }
}
function resolveSetupTask(G,t,choice){
 const P=G.players[t.p];
 if(t.type==='initPort'){ if(!doInitPort(G,P,choice))return false; }
 else if(t.type==='patPick'){ const h=G.hands[t.p],i=choice|0; if(i<0||i>=h.length)return false; P.sup.push(h.splice(i,1)[0]); }
 else if(t.type==='patKeep'){ const i=choice|0; if(i<0||i>=P.sup.length)return false; P.sup.splice(i,1); }
 else if(t.type==='honorPick'){ if(!G.pReveal.includes(choice))return false; P.personal=choice; G.pReveal=G.pReveal.filter(x=>x!==choice); }
 else if(t.type==='pirPick'){ const off=G.pir.offers[t.p][t.kind]; if(!off.includes(choice))return false; P.pick[t.kind]=choice; }
 else if(t.type==='resChoice'){ if(!RES.includes(choice))return false; P.store[choice]+=t.n; logm(G,P.name+': '+RN[choice]+' '+t.n+'개 획득'); }
 else if(t.type==='corn'){ if((choice|0)&&P.store.gold>=3){ P.store.gold-=3; P.cqCubes++; logm(G,P.name+': 코르넬리우스 — 금 3으로 자원 큐브 1개 (보유 '+P.cqCubes+')'); } }
 else if(t.type==='hadr'){ const k=Math.max(0,Math.min(2,choice|0,P.amp)); P.amp-=k; P.hadAmp+=k; if(k)logm(G,P.name+': 하드리아누스에 암포라 '+k+'개'); }
 else if(t.type==='whiteC'){ const s=choice|0; if(s<0||s>5)return false; P.harbor[s].push('W'); logm(G,P.name+': 흰색 코르비타 → '+SEGS[s].name+' 구역'); }
 else if(t.type==='light'){ if(!UPG_KEYS.includes(choice)||P.upg[choice])return false; P.upg[choice]=true; logm(G,P.name+': 등대 → 「'+UPG[choice]+'」'); if(choice==='triumph')addTri(G,P,1); }
 else return false;
 removeTask(G,t); return true;
}
/* 큐가 비었을 때 호출: 설정 진행 / 턴 종료 판단 */
function settle(G){
 if(G.over)return;
 if(G.phase==='setup'&&!G.queue.length)setupNext(G);
 else if(G.phase==='play'&&G.turn&&G.turn.stage==='post'&&!G.queue.length)finalizeTurn(G);
 else if(G.phase==='final'&&!G.queue.length)finishGame(G);
}


/* =========================================================
   PIRATES 로직
   ========================================================= */
function initPirates(G){
 const np=G.np;
 const def=[{sp:[2,2,2,3,4,4],rd:[],b:2,r:4},{sp:[2,2,2,3,4,4],rd:[4],b:2,r:4},{sp:[2,2,2,3,3,4],rd:[2],b:2,r:5},{sp:[2,2,2,3,3,4],rd:[4],b:2,r:5},{sp:[2,2,2,3,3,4],rd:[2],b:2,r:6,fin:true}];
 const kinds=shuffle(G,Object.keys(EVK)).slice(0,4);
 const ct=shuffle(G,CITY_TILES.slice());
 G.pir={ships:Object.assign({},PIRATE_PORTS),pending:[],offers:[],
  secs:def.map((d,i)=>({b:d.b,r:d.r,fin:!!d.fin,tile:d.fin?null:kinds[i],done:false,sp:d.sp.map((m,j)=>({m,on:m<=np,taken:false,rd:d.rd.includes(j)}))})),
  city:CITY_SPACES.map((s,i)=>{ const tile=s.m<=np?ct[i]:null,c=Object.assign({},s.c); if(tile&&tile.plus)for(const k in c)c[k]+=tile.plus; return {m:s.m,c,tile}; })};
}
const chestsLeft=G=>G.pir.secs.some(sec=>sec.sp.some(s=>s.on&&!s.taken));
function pirateAt(G,node){ return (G.pir&&G.pir.ships[node])||null; }
function pirateNeed(G,color){

}
function repelInfo(G,P,node){
 const c=pirateAt(G,node); if(!c)return null;

}
function takeChests(G,P,n){
 let got=0;
 for(let k=0;k<n;k++){
  let f=null; for(const sec of G.pir.secs){ const sp=sec.sp.find(s=>s.on&&!s.taken); if(sp){f={sec,sp};break;} }
  if(!f)break;
  f.sp.taken=true; P.treasure++; got++;
  if(!f.sec.sp.some(s=>s.on&&!s.taken)){ f.sec.done=true; if(!f.sec.fin)G.pir.pending.push(f.sec); }
  if(f.sp.rd)redeem(G,P);

 if(got)logm(G,P.name+': 보물 상자 '+got+'개 획득 (보유 '+P.treasure+')');

}
function redeem(G,P){

 else G.queue.unshift({type:'resChoice',p:P.id,n:2,txt:'불명예가 없어 자원 2개를 받아요 (한 종류)'});
}
function evCount(G,P,k){

 switch(k){
  case 'chest':return P.treasure; case 'bld':return ic.bld; case 'ship':return ic.ship; case 'order':return P.orders.length;
  case 'exo':return ic.exo; case 'wild':return ic.wild; case 'steps':return P.main.reduce((a,s)=>a+DEPTH[s.node],0);

}
function resolveEvent(G,sec){
 const k=sec.tile,cs=G.players.map(P=>evCount(G,P,k)),mx=Math.max(...cs),mn=Math.min(...cs),all=mx===mn;
 const topN=cs.filter(c=>c===mx).length;
 logm(G,'📜 이벤트 해결 — '+EVK[k]+' 비교 ('+G.players.map((P,i)=>P.name+' '+cs[i]).join(', ')+')');

  if(all||cs[i]===mx){ redeem(G,P); if(P.supp==='quintilianus'){ const n=(topN===1&&!all)?2:1; P.qCubes+=n; logm(G,P.name+': 퀸틸리아누스 큐브 +'+n); } }
  else if(cs[i]===mn){ P.dis++; logm(G,P.name+': 최하위 — 불명예 큐브 +1'); }
  if(P.home==='cyrene'){ const ic=gameIcons(P),w=3*Math.min(ic.man,ic.woman); if(w){P.store.wheat+=w; logm(G,P.name+': 키레네 — 밀 '+w);} }
  if(P.treasure){ P.store.gold+=P.treasure; }
  if(P.supp==='hadrianus'&&P.amp>0)G.queue.push({type:'hadr',p:P.id});
 });
 logm(G,'각자 보물 상자 수만큼 금을 받았어요.');
}
/* 군단병·무기·불명예 자유 행동 */
function buyWeapons(G,P,k){
 if(!G.pir||P.wb||!(G.queue[0]&&G.queue[0].type==='purchase')||k<1||k>6||P.store.gold<WCOST[k])return false;

}
function legCost(P){ if(P.leg<4)return LEG[P.leg]; if(P.leg===4&&P.supp==='havitius')return LEG5; return null; }
function canHire(P){ const c=legCost(P); if(!c)return false; return Object.keys(c).every(k=>k==='weapons'?P.weapons>=c[k]:P.store[k]>=c[k]); }
function hireLeg(G,P){
 if(!canHire(P))return false; const c=legCost(P);
 for(const k in c){ if(k==='weapons')P.weapons-=c[k]; else P.store[k]-=c[k]; }

}
function redeemGold(G,P){ if(P.dis<=0||P.store.gold<7)return false; P.store.gold-=7; P.dis--; logm(G,P.name+': 금 7로 불명예 해소 (남은 '+P.dis+')'); return true; }
function useAnt(G,P,k){

 if(k===0)G.queue.unshift({type:'sail',p:P.id,free:true,steps:3,single:false,stage:'move'});
 else if(k===1)G.queue.unshift({type:'build',p:P.id,free:true,max:1,built:0});
 else if(k===2)G.queue.unshift({type:'construct',p:P.id,free:true,max:1,built:0});
 else G.queue.unshift({type:'deliver',p:P.id,free:true});

}
function cityOptions(G,P){
 if(!G.pir)return [];
 return G.pir.city.map((s,i)=>i).filter(i=>{ const s=G.pir.city[i]; return s.tile&&Object.keys(s.c).every(k=>P.store[k]>=s.c[k]); });
}
function applyCity(G,P,tile){

  case 'all2':RES.forEach(r=>P.store[r]+=2); break;
  case 'triRedeem':addTri(G,P,1); redeem(G,P); break;
  case 'weapon3':P.weapons+=3; break;
  case 'chest':takeChests(G,P,1); break;
  case 'leg':if(legCost(P)){P.leg++; logm(G,P.name+': 군단병 무료 고용');} break;
  case 'xb':P.xb++; break; case 'xs':P.xs++; break;

  case 'nobles':P.xman++; P.xwoman++; break;

}
function aiPirFree(G,P){

}

 let g=`<svg viewBox="0 0 270 ${Ht}" class="tboard" role="img" aria-label="건설·조선 트랙"><rect x="2" y="2" width="266" height="${Ht-4}" rx="10" fill="#e4efe9" stroke="#8fb5a8" stroke-width="2"/>

const A={
 setNp(n){U.setup.np=n;render();},
 tab(k){U.tab=k;render();window.scrollTo(0,0);},

 speed(v,el){U.speed=+el.value;},
 info(n){U.info=U.info===n?null:n;render();},

const UIONLY=new Set(['logToggle','setNp','seat','tab','triToggle','opt','name','speed','info','newGame','start','dvToggle','dvBonus','conNode','conSlot','dropReset','undo','endTurn']);
function run(a,v,el){
 if(!A[a])return;
 if(UIONLY.has(a)||!G){ A[a](v,el); return; }
 const before=JSON.stringify(G),ph0=G.phase; A[a](v,el);
 if(G&&ph0==='setup'&&G.phase==='play'){ U.hist=[]; render(); return; }
 if(G&&JSON.stringify(G)!==before){ U.hist.push(before); if(U.hist.length>150)U.hist.shift(); render(); }
}

});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-a]'); if(!el)return; const a=el.dataset.a,v=el.dataset.v!==undefined?JSON.parse(el.dataset.v):undefined; run(a,v,el);
});

 if(G.queue.length)return G.players[G.queue[0].p].ai;
 if(G.phase==='setup')return true;
 if(G.phase==='play'&&G.turn)return G.players[G.cur].ai;
 return false;
}
function schedule(){
 clearTimeout(U.tm); if(!aiActing())return;
 U.tm=setTimeout(()=>{ U.hist=[]; aiStep(G); settle(G); render(); schedule(); },U.speed);
}
function autoFinish(){ for(let i=0;i<5;i++){ const t=G.queue[0]; if(t&&t.type==='sail'&&t.stage==='move'&&t.steps<=0&&!G.players[t.p].ai)finishSail(G,t); else break; } }
function commit(){ autoFinish(); settle(G); render(); schedule(); }
render();


/* 툴팁: 마우스 올리기 / 터치 길게 누르기 */
(function(){
 let tip=null,tm=null,lp=0;
 const show=(el,x,y)=>{ hide(); const t=el.getAttribute('data-tip'); if(!t)return; tip=document.createElement('div'); tip.className='tip'; tip.textContent=t; document.body.appendChild(tip);
  const w=tip.offsetWidth,h=tip.offsetHeight; tip.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px'; tip.style.top=Math.max(6,y-h-14)+'px'; };
 const hide=()=>{ clearTimeout(tm); if(tip){tip.remove();tip=null;} };
 document.addEventListener('mouseover',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(el){ const r=el.getBoundingClientRect(); show(el,r.left+r.width/2,r.top); } else if(tip)hide(); });
 document.addEventListener('touchstart',e=>{ const el=e.target.closest&&e.target.closest('[data-tip]'); if(!el)return; const r=el.getBoundingClientRect(); clearTimeout(tm); tm=setTimeout(()=>{show(el,r.left+r.width/2,r.top);lp=Date.now();},380); },{passive:true});
 document.addEventListener('click',e=>{ if(Date.now()-lp<900&&e.target.closest&&e.target.closest('[data-tip]')){ e.stopPropagation(); e.preventDefault(); lp=0; } },true);
 ['touchend','touchmove','touchcancel','scroll'].forEach(n=>document.addEventListener(n,()=>{ if(n==='touchend'&&tip)setTimeout(hide,1400); else if(n!=='touchend')hide(); else clearTimeout(tm); },{passive:true,capture:true}));
 document.addEventListener('contextmenu',e=>{ if(e.target.closest&&e.target.closest('[data-tip]'))e.preventDefault(); });
})();

</script></body></html>

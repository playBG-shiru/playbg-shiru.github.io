<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보드게임 온라인 · 게임 선택</title>
<script>try{var h=(location.hash||"").replace("#","").trim().toUpperCase();if(/^[A-HJ-NP-Z2-9]{5}$/.test(h))location.replace("sweetland.html#"+h);else if(/^O[A-HJ-NP-Z2-9]{4}$/.test(h))location.replace("ostia.html#"+h);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14202b;--ink:#f3ece0;--mut:#a9b5bd}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Gowun Dodum',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 20% -10%,#2a4a5a 0,transparent 60%),radial-gradient(900px 500px at 100% 110%,#4a2f45 0,transparent 55%),var(--bg);display:flex;flex-direction:column;align-items:center;padding:36px 16px 48px}
h1{margin:0;font-size:clamp(26px,5vw,40px);letter-spacing:.02em}
.sub{margin:8px 0 28px;color:var(--mut);font-size:15px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%;max-width:820px}
.g{position:relative;display:flex;flex-direction:column;gap:10px;min-height:250px;padding:22px 22px 20px;border-radius:20px;text-decoration:none;color:inherit;overflow:hidden;border:2px solid rgba(255,255,255,.14);transition:transform .15s,box-shadow .15s}
.g:hover,.g:focus-visible{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.4);outline:none}
.g .ic{font-size:54px;line-height:1}
.g h2{margin:0;font-size:26px}
.g p{margin:0;color:inherit;opacity:.82;font-size:14.5px;line-height:1.5}
.g .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.g .tags span{font-size:12.5px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.18)}
.g .go{position:absolute;right:18px;top:18px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.9);color:#222}
.sweet{background:linear-gradient(150deg,#ffb7cf,#ffd9a8);color:#4a1f33;border-color:#fff6}
.ostia{background:linear-gradient(150deg,#12525a,#1d3552);color:#f6e7bd;border-color:#e3c46a88}
.ostia h2{font-family:'Cinzel','Gowun Dodum',serif;letter-spacing:.08em}
.soon{border-style:dashed;background:rgba(255,255,255,.04);color:var(--mut);align-items:center;justify-content:center;text-align:center}
.soon .ic{opacity:.5}
footer{margin-top:32px;color:var(--mut);font-size:12.5px}

.acct{position:fixed;top:12px;right:14px;z-index:20;display:flex;align-items:center;gap:8px;font-size:14px}
.acct button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:6px 14px}
.acct button:hover{background:rgba(255,255,255,.2)}.acct .nm{padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.25)}
.mdl{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}.mdl.on{display:flex}
.mdl form{width:min(340px,92vw);background:#1b2c3a;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.mdl h3{margin:0 0 2px;font-size:20px}.mdl input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:#0f1b25;color:var(--ink)}
.mdl .tabs{display:flex;gap:6px}.mdl .tabs button{flex:1;font:inherit;padding:7px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--ink);cursor:pointer}.mdl .tabs .on{background:#e3c46a;color:#222;border-color:#e3c46a}
.mdl .ok{font:inherit;padding:10px;border-radius:10px;border:0;background:#e3c46a;color:#222;font-weight:700;cursor:pointer}.mdl .x{align-self:flex-end;background:none;border:0;color:var(--mut);cursor:pointer;font:inherit}
.mdl .msg{min-height:1.2em;margin:0;font-size:13px;color:#ffb3a3}
.g .tags span.rs{background:#e3c46a;color:#222;font-weight:700}
.note{margin:-14px 0 22px;font-size:13px;color:var(--mut);text-align:center}

.rooms{width:100%;max-width:820px;margin-top:26px;display:none}.rooms.on{display:block}
.rooms h3{margin:0 0 10px;font-size:17px;color:var(--ink)}
.rm{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:14px}
.rm .gi{font-size:22px}.rm b{letter-spacing:.08em}.rm .pl{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm .st{font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(0,0,0,.25)}.rm .st.me{background:#e3c46a;color:#222;font-weight:700}
.rm a{color:#222;background:#e3c46a;text-decoration:none;font-weight:700;padding:6px 14px;border-radius:99px;font-size:13px}
</style>
</head>
<body>
<div class="acct" id="acct"><button id="lb" type="button">🔑 로그인</button></div>
<div class="mdl" id="mdl"><form id="lf" autocomplete="on"><button type="button" class="x" id="lx">닫기 ✕</button><h3>스위트랜드 · 오스티아 공용 계정</h3>
<div class="tabs"><button type="button" id="tin" class="on">로그인</button><button type="button" id="tup">가입</button></div>
<input id="fid" placeholder="아이디 (영문 소문자·숫자·_ 3~16자)" autocomplete="username"><input id="fnk" placeholder="닉네임 (1~12자)" maxlength="12" style="display:none"><input id="fpw" type="password" placeholder="비밀번호 (4자 이상)" autocomplete="current-password">
<p class="msg" id="lm"></p><button class="ok" type="submit" id="lok">로그인</button></form></div>
<h1>🎲 보드게임 온라인</h1>
<p class="sub">같이 하고 싶은 게임을 골라 주세요</p>
<p class="note" id="note">로그인하면 스위트랜드와 오스티아에서 같은 계정으로 하던 게임이 저장돼요</p>
<main class="grid">
 <a class="g sweet" href="sweetland.html" aria-label="스위트랜드 시작">
  <span class="go">플레이 ▶</span>
  <span class="ic">🍰</span>
  <h2>스위트랜드</h2>
  <p>시민을 모으고 영지를 가꾸는 달콤한 영지 경영 보드게임.</p>
  <div class="tags" id="tg-sw"><span>AI 대전</span><span>온라인</span></div>
 </a>
 <a class="g ostia" href="ostia.html" aria-label="오스티아 시작">
  <span class="go">플레이 ▶</span>
  <span class="ic">⚓</span>
  <h2>OSTIA</h2>
  <p>로마 항구 도시의 교역 · 건설 · 납품 게임. 마리너 · 상인 · 후원자 · 해적 확장 포함.</p>
  <div class="tags" id="tg-os"><span>AI 초급·중급·고급</span><span>확장 4종</span></div>
 </a>
 <div class="g soon" aria-hidden="true">
  <span class="ic">➕</span>
  <h2>다음 게임</h2>
  <p>준비 중이에요</p>
 </div>
</main>
<section class="rooms" id="rooms"><h3>🚪 열린 방</h3><div id="rl"></div></section>
<footer>© 보드게임 온라인 · 개인 제작</footer>
<script>
(function(){
var CFG={apiKey:'AIzaSyALdTRq9QPBgF0vfINe51HWScY8uohk_iw',authDomain:'sweet-1869f.firebaseapp.com',projectId:'sweet-1869f',storageBucket:'sweet-1869f.firebasestorage.app',messagingSenderId:'13752270383',appId:'1:13752270383:web:34d9c2e78e6b2f28b8d0da'};
var VER='10.12.2',MAIL='@sweetland.app',PAD='#sweet',fb=null,mode='in',$=function(i){return document.getElementById(i)};
function load(){ if(window.__FB_SDK__)return Promise.resolve(window.__FB_SDK__); if(fb)return fb;
 var b='https://www.gstatic.com/firebasejs/'+VER+'/';
 fb=Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]).then(function(m){ var app=m[0].initializeApp(CFG),auth=m[1].getAuth(app); return {auth:auth,authM:m[1],fs:m[2],dbi:m[2].initializeFirestore(app,{ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true})}; });
 return fb; }
function show(u){
 var a=$('acct'); a.innerHTML='';
 if(u&&!u.isAnonymous){ var n=document.createElement('span'); n.className='nm'; n.textContent='👤 '+(u.displayName||(u.email||'').split('@')[0]); var o=document.createElement('button'); o.type='button'; o.textContent='로그아웃'; o.onclick=out; a.appendChild(n); a.appendChild(o); $('note').style.display='none'; resume(u); lobby(u); }
 else { if(lun){lun();lun=null;} $('rooms').classList.remove('on'); var b=document.createElement('button'); b.type='button'; b.textContent='🔑 로그인'; b.onclick=function(){ $('mdl').classList.add('on'); $('fid').focus(); }; a.appendChild(b); $('note').style.display=''; ['tg-sw','tg-os'].forEach(function(i){ var r=$(i).querySelector('.rs'); if(r)r.remove(); }); } }
function tag(id,t){ var el=$(id); if(el.querySelector('.rs'))return; var s=document.createElement('span'); s.className='rs'; s.textContent=t; el.insertBefore(s,el.firstChild); }
function resume(u){ load().then(function(f){ var d=function(p){ return f.fs.getDoc(f.fs.doc(f.dbi,p)).then(function(x){return x.exists();}).catch(function(){return false;}); };
 d('users/'+u.uid+'/save/ostia').then(function(e){ if(e)tag('tg-os','이어하기'); });
 d('users/'+u.uid+'/save/current').then(function(e){ if(e)tag('tg-sw','이어하기'); }); }); }

var lun=null;
function lobby(u){ if(lun)return; load().then(function(f){ var fs=f.fs; lun=fs.onSnapshot(fs.query(fs.collection(f.dbi,'games'),fs.limit(60)),function(sn){
 var rows=[]; sn.docs.forEach(function(d){ var m=d.data(); if(!m||!m.code||m.status==='ended')return; var os=m.game==='ostia',seats=m.seats||[],mine=seats.some(function(s){return s&&s.token===u.uid;}),open=seats.some(function(s){return s&&s.type==='human'&&!s.token;});
  if(m.status!=='lobby'&&!mine)return; if(m.status==='lobby'&&!mine&&!open)return;
  rows.push({m:m,os:os,mine:mine}); });
 rows.sort(function(a,b){ return (b.mine-a.mine)||((b.m.created||0)-(a.m.created||0)); });
 var box=$('rl'); box.innerHTML=''; $('rooms').classList.toggle('on',rows.length>0);
 rows.forEach(function(r){ var m=r.m,div=document.createElement('div'); div.className='rm';
  var names=(m.seats||[]).map(function(s){ return (s&&(s.name||(s.type==='ai'?'AI':'')))||'빈자리'; }).join(' · ');
  div.innerHTML='<span class="gi">'+(r.os?'⚓':'🍰')+'</span><b></b><span class="pl"></span><span class="st'+(r.mine?' me':'')+'"></span><a></a>';
  div.querySelector('b').textContent=m.code; div.querySelector('.pl').textContent=names;
  div.querySelector('.st').textContent=r.mine?(m.status==='lobby'?'내 방 · 대기 중':'내 방 · 진행 중'):'대기 중';
  var a=div.querySelector('a'); a.textContent=r.mine?'들어가기':'입장'; a.href=(r.os?'ostia.html#':'sweetland.html#')+m.code; box.appendChild(div); }); },function(){ }); }); }
function out(){ load().then(function(f){ return f.authM.signOut(f.auth); }); }
function setMode(m){ mode=m; $('tin').classList.toggle('on',m==='in'); $('tup').classList.toggle('on',m==='up'); $('fnk').style.display=m==='up'?'':'none'; $('lok').textContent=m==='up'?'가입하기':'로그인'; $('fpw').autocomplete=m==='up'?'new-password':'current-password'; $('lm').textContent=''; }
$('tin').onclick=function(){setMode('in')}; $('tup').onclick=function(){setMode('up')}; $('lx').onclick=function(){$('mdl').classList.remove('on')};
$('mdl').addEventListener('click',function(e){ if(e.target===this)this.classList.remove('on'); });
$('lf').onsubmit=function(e){ e.preventDefault();
 var id=$('fid').value.trim().toLowerCase(),pw=$('fpw').value,nk=$('fnk').value.trim(),m=$('lm');
 if(!/^[a-z0-9_]{3,16}$/.test(id)){ m.textContent='아이디는 영문 소문자·숫자·밑줄 3~16자예요'; return; }
 if(pw.length<4){ m.textContent='비밀번호는 4자 이상이에요'; return; }
 if(mode==='up'&&(!nk||nk.length>12)){ m.textContent='닉네임을 1~12자로 입력해 주세요'; return; }
 m.textContent='처리 중…';
 load().then(function(f){ var A=f.authM;
  return mode==='up'?A.createUserWithEmailAndPassword(f.auth,id+MAIL,pw+PAD).then(function(c){ return A.updateProfile(c.user,{displayName:nk}); }):A.signInWithEmailAndPassword(f.auth,id+MAIL,pw+PAD); })
 .then(function(){ $('mdl').classList.remove('on'); $('fpw').value=''; m.textContent=''; return load(); }).then(function(f){ show(f.auth.currentUser); })
 .catch(function(er){ var c=(er&&er.code)||''; m.textContent=c==='auth/email-already-in-use'?'이미 있는 아이디예요':/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?'아이디 또는 비밀번호가 맞지 않아요':'연결에 실패했어요 ('+c+')'; }); };
load().then(function(f){ f.authM.onAuthStateChanged(f.auth,function(u){ show(u); }); }).catch(function(){});
})();
</script>
</body>
</html>
